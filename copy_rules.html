<!DOCTYPE html>
<html>
<head>
<title>Database Rules</title>
<style>
body { font-family: monospace; padding: 20px; background: #f4f4f4; }
textarea { width: 100%; height: 500px; font-family: monospace; padding: 10px; }
button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; font-size: 16px; margin-bottom: 20px;}
</style>
</head>
<body>
<button onclick="copyRules()">Copy Rules to Clipboard</button>
<p id="msg"></p>
<textarea id="rulesText" readonly>
{
  "rules": {
    "users": {
      ".indexOn": ["referralCode", "balance"],
      ".read": "auth != null",
      "$uid": {
        ".read": "auth != null",
        ".write": "auth != null && (auth.uid === $uid || auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')"
      }
    },
    "settings": {
      ".read": true,
      ".write": "auth != null && (auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')"
    },
    "top_sellers": {
      ".read": true,
      ".write": "auth != null && (auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')"
    },
    "used_emails": {
      ".indexOn": [
        "email"
      ],
      ".read": "auth != null",
      "$emailKey": {
        ".write": "auth != null"
      }
    },
    "submissions": {
      ".indexOn": ["userId", "status", "submittedAt"],
      ".read": "auth != null",
      "$subId": {
        ".write": "auth != null && (newData.child('userId').val() === auth.uid || data.child('userId').val() === auth.uid || auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')"
      }
    },
    "user_submissions": {
      "$uid": {
        ".read": "auth != null && (auth.uid === $uid || auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')",
        ".write": "auth != null && (auth.uid === $uid || auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')"
      }
    },
    "withdraw_requests": {
      ".indexOn": ["userId", "status", "requestedAt"],
      ".read": "auth != null",
      "$reqId": {
        ".write": "auth != null && (newData.child('userId').val() === auth.uid || data.child('userId').val() === auth.uid || auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')"
      }
    },
    "user_withdrawals": {
      "$uid": {
        ".read": "auth != null && (auth.uid === $uid || auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')",
        ".write": "auth != null && (auth.uid === $uid || auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')"
      }
    },
    "support_chats": {
      ".read": "auth != null",
      "$uid": {
        ".read": "auth != null && (auth.uid === $uid || auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')",
        ".write": "auth != null && (auth.uid === $uid || auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')"
      }
    },
    "admin_notifications": {
      ".read": "auth != null",
      ".write": "auth != null && (auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')"
    },
    "history": {
      ".read": "auth != null",
      ".write": "auth != null && (auth.token.email === 'iamronyofficial1@gmail.com' || auth.token.email === 'gmrony135@gmail.com')"
    }
  }
}
</textarea>
<script>
function copyRules() {
  var copyText = document.getElementById("rulesText");
  copyText.select();
  copyText.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(copyText.value);
  document.getElementById("msg").innerText = "Copied! Now paste it in Firebase Console -> Realtime Database -> Rules";
}
</script>
</body>
</html>
